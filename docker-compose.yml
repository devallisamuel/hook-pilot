name: hook-pilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookpilot
      POSTGRES_PASSWORD: hookpilot
      POSTGRES_DB: hookpilot
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookpilot"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  api:
    build: .
    profiles: [app]
    command: ["node", "dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://hookpilot:hookpilot@postgres:5432/hookpilot
      REDIS_URL: redis://redis:6379/0
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    profiles: [app]
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://hookpilot:hookpilot@postgres:5432/hookpilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
